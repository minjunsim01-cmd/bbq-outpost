<script>
const DEFAULT_LOCATIONS={'찰':'2CAB Motorpool Gate','해쿼':'304th HQ','헤쿼':'304th HQ','71':'Spartan DFAC','73':'7312 Motorpool','74':'7437 Motorpool','75':'6940 Parking Lots','슈행':'Superhangar','61':'Semaphore DFAC','63':'6323 Barracks','67':'6707 Barracks','68':'6872 Barracks','69':'6900 Barracks','잭클':'Zoeckler Gym','좨':'Zoeckler Gym','원스탑':'Maude Hall Parking Lots','USFK':'USFK parking lot','Usfk':'USFK parking lot','usfk':'USFK parking lot'};
let locations={...DEFAULT_LOCATIONS};
try{const saved=localStorage.getItem('bbq_locations_v76');if(saved)locations=JSON.parse(saved)||{...DEFAULT_LOCATIONS}}catch(e){locations={...DEFAULT_LOCATIONS}}
const templateImg=document.getElementById('masterTemplate');let templateReady=false;
function forceRender(){requestAnimationFrame(()=>{renderAll();setTimeout(renderAll,60);setTimeout(renderAll,250)})}
function templateLoaded(){templateReady=true;forceRender()}
function templateFailed(){templateReady=false;const info=document.getElementById('storyInfo');if(info)info.textContent='마스터 템플릿 로딩 실패 · V7.6.2'}
templateImg.addEventListener('load',templateLoaded);
templateImg.addEventListener('error',templateFailed);
if(templateImg.complete&&templateImg.naturalWidth){templateReady=true}
if(templateImg.decode){templateImg.decode().then(()=>{templateReady=true;forceRender()}).catch(()=>{})}
function showView(id){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.v===id));if(id==='story')renderStory();if(id==='facebook')renderFacebook();if(id==='locations')renderLocations()}
function cleanLine(s){return s.replace(/[🚚🚎🔥•·]/g,' ').replace(/^[-–—\s]+|[-–—\s]+$/g,'').trim()}
function mapLocation(s){let v=cleanLine(s).replace(/^\d+\s*[-.)]\s*/,'').replace(/\s+\d+(?:\.\d+)?\s*$/,'').trim();return locations[v]||v}
function parseDate(text){const now=new Date();let y=now.getFullYear(),m=null,d=null;let x=text.match(/(20\d{2})[.\/-](\d{1,2})[.\/-](\d{1,2})/);if(x){y=+x[1];m=+x[2];d=+x[3]}if(!x){x=text.match(/(\d{1,2})\s*[\/-]\s*(\d{1,2})/);if(x){m=+x[1];d=+x[2]}}if(!x){x=text.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일?/);if(x){m=+x[1];d=+x[2]}}return m&&d?new Date(y,m-1,d):now}
function parseSchedule(){const text=document.getElementById('raw').value||'';const lines=text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);let section='';const lunch=[],dinner=[];for(const line of lines){if(/^(점심|점|lunch)/i.test(line)){section='lunch';continue}if(/^(저녁|저|dinner)/i.test(line)){section='dinner';continue}if(/^(20\d{2}[-./]|\d{1,2}\s*[\/-]\s*\d{1,2}|\d{1,2}\s*월\s*\d{1,2})/.test(line))continue;const normalized=cleanLine(line).replace(/^\d+\s*[-.)]\s*/,'').replace(/\s+\d+(?:\.\d+)?\s*$/,'').trim();if(/^오산(?:\s|$)/i.test(normalized)||/^osan(?:\s|$)/i.test(normalized))continue;const place=mapLocation(line);if(section==='lunch')lunch.push(place);if(section==='dinner')dinner.push(place)}return{date:parseDate(text),lunch,dinner}}
function dateTexts(dt){const months=['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];const days=['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];return{date:`${months[dt.getMonth()]} ${dt.getDate()}`,day:days[dt.getDay()]}}
function fitText(ctx,text,max,start,min){for(let s=start;s>=min;s--){ctx.font=`900 ${s}px Arial Black,Arial,sans-serif`;if(ctx.measureText(text).width<=max)return s}return min}
const ROWS={lunch:{x:170,y:[541,594,647,700,753],max:790,start:29,min:19},dinner:{x:170,y:[908,961,1014,1067,1120],max:790,start:28,min:19}};
function drawRows(ctx,key,items){const o=ROWS[key];ctx.save();ctx.fillStyle='#fff';ctx.textAlign='left';ctx.textBaseline='middle';ctx.shadowColor='rgba(0,0,0,.78)';ctx.shadowBlur=2;items.slice(0,5).forEach((t,i)=>{const fs=fitText(ctx,t,o.max,o.start,o.min);ctx.font=`900 ${fs}px Arial Black,Arial,sans-serif`;ctx.fillText(t,o.x,o.y[i])});ctx.restore()}
function drawDate(ctx,dt){const t=dateTexts(dt);ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.shadowColor='#000';ctx.shadowBlur=4;let fs=42;ctx.font=`900 ${fs}px Arial Black,Arial,sans-serif`;while(ctx.measureText(t.date).width>330&&fs>27){fs--;ctx.font=`900 ${fs}px Arial Black,Arial,sans-serif`}ctx.fillText(t.date,540,276);ctx.font='900 17px Arial Black,Arial,sans-serif';ctx.fillText(t.day,540,310);ctx.restore()}
function renderStory(){const c=document.getElementById('storyCanvas');if(!c)return;const ctx=c.getContext('2d');ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.clearRect(0,0,1080,1440);if(!templateReady||!templateImg.naturalWidth){ctx.fillStyle='#071008';ctx.fillRect(0,0,1080,1440);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='700 30px Arial';ctx.fillText('마스터 템플릿 확인 중...',540,720);ctx.restore();return}ctx.drawImage(templateImg,0,0,1080,1440);const d=parseSchedule();drawDate(ctx,d.date);drawRows(ctx,'lunch',d.lunch);drawRows(ctx,'dinner',d.dinner);ctx.restore();document.getElementById('storyInfo').textContent=`정상 로드 · Lunch ${Math.min(d.lunch.length,5)}곳 · Dinner ${Math.min(d.dinner.length,5)}곳 · @bbqoutpost_official`}
function renderFacebook(){const d=parseSchedule(),t=dateTexts(d.date);let s=`🔥 ${t.date} SCHEDULE 🔥\n\nLunch (11:00~13:00)\n\n`;d.lunch.slice(0,5).forEach((x,i)=>s+=`${i%2?'🚎':'🚚'} ${i+1} - ${x}\n`);s+='\nDinner (16:00~18:30)\n\n';d.dinner.slice(0,5).forEach((x,i)=>s+=` ${i%2?'🚎':'🚚'} ${i+1} - ${x}\n`);s+='\n#CampHumphreys #USAG #Humphreys #USFK #BBQoutpost #USAGHumphreys';document.getElementById('fb').textContent=s}
function renderAll(){const d=parseSchedule();document.getElementById('summary').textContent=`Lunch ${d.lunch.length}곳 · Dinner ${d.dinner.length}곳 · ${dateTexts(d.date).date}`;renderFacebook();renderStory()}
function copyFb(){navigator.clipboard.writeText(document.getElementById('fb').textContent||'').then(()=>alert('복사했어.'))}
function downloadStory(){renderStory();const d=parseSchedule(),a=document.createElement('a');a.download=`BBQ_Outpost_Story_${d.date.getFullYear()}-${String(d.date.getMonth()+1).padStart(2,'0')}-${String(d.date.getDate()).padStart(2,'0')}.png`;a.href=document.getElementById('storyCanvas').toDataURL('image/png');a.click()}
function renderLocations(){const box=document.getElementById('locationRows');box.innerHTML='';Object.entries(locations).sort((a,b)=>a[0].localeCompare(b[0])).forEach(([k,v])=>{const r=document.createElement('div');r.className='locrow';const key=document.createElement('input');key.value=k;key.disabled=true;const name=document.createElement('input');name.value=v;name.onchange=e=>{locations[k]=e.target.value.trim();saveLoc();renderAll()};const del=document.createElement('button');del.className='danger';del.textContent='삭제';del.onclick=()=>{delete locations[k];saveLoc();renderLocations();renderAll()};r.append(key,name,del);box.appendChild(r)})}
function addLocation(){const k=document.getElementById('newKey').value.trim(),v=document.getElementById('newName').value.trim();if(!k||!v)return;locations[k]=v;document.getElementById('newKey').value='';document.getElementById('newName').value='';saveLoc();renderLocations();renderAll()}
function resetLocations(){locations={...DEFAULT_LOCATIONS};saveLoc();renderLocations();renderAll()}
function saveLoc(){localStorage.setItem('bbq_locations_v76',JSON.stringify(locations))}
renderLocations();renderAll();
window.addEventListener('load',forceRender);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)forceRender()});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(forceRender).catch(()=>{});
setTimeout(forceRender,500);
</script>
</body></html>
