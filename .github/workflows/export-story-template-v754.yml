name: Export Story Template V7.5.4

on:
  push:
    paths:
      - '.github/workflows/export-story-template-v754.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract embedded JPEG and switch loader to normal image file
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, base64

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          m=re.search(r"const STORY_TEMPLATE_B64='([^']+)'", s, re.S)
          if not m:
              m=re.search(r"const STORY_TEMPLATE_SRC='data:image/jpeg;base64,([^']+)'", s, re.S)
          if not m:
              raise SystemExit('Embedded JPEG data not found')

          data=base64.b64decode(m.group(1), validate=True)
          if not data.startswith(b'\xff\xd8\xff'):
              raise SystemExit('Embedded template is not valid JPEG')
          Path('story-master.jpg').write_bytes(data)

          start=s.index('const templateImg=new Image();let templateReady=false;')
          end=s.index('\nfunction showView', start)
          loader="""const templateImg=new Image();let templateReady=false;
templateImg.onload=()=>{templateReady=true;renderStory()};
templateImg.onerror=(e)=>{templateReady=false;const info=document.getElementById('storyInfo');if(info)info.textContent='마스터 템플릿 파일을 불러오지 못했어 · V7.5.4';console.error(e)};
templateImg.src='./story-master.jpg?v=754';
"""
          s=s[:start]+loader+s[end:]
          s=s.replace('SNS Manager V7.5.3','SNS Manager V7.5.4')
          s=s.replace('<span class="pill">V7.5.3</span>','<span class="pill">V7.5.4</span>')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Remove temporary workflow
        run: rm -f .github/workflows/export-story-template-v754.yml .github/workflows/fix-template-loader-v753.yml .github/workflows/fix-template-loader-v753b.yml

      - name: Commit normal JPEG asset loader
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html story-master.jpg .github/workflows
          git commit -m "Use normal JPEG file for Story master template V7.5.4"
          git push
