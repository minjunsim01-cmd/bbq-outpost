name: Inline Story Template

on:
  push:
    paths:
      - '.github/workflows/inline-story-template.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inline-template:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inline master template into index.html
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          index = Path('index.html')
          b64file = Path('story-master-v2.b64')
          html = index.read_text(encoding='utf-8')
          b64 = b64file.read_text(encoding='utf-8').strip()

          if not b64.startswith('/9j/'):
              raise SystemExit('story-master-v2.b64 is not JPEG base64')

          old = re.compile(
              r"const templateImg=new Image\(\);let templateReady=false;\s*"
              r"templateImg\.onload=.*?;\s*"
              r"templateImg\.onerror=.*?;\s*"
              r"fetch\('story-master-v2\.b64'.*?\.catch\(\(\)=>templateImg\.onerror\(\)\);",
              re.S
          )

          replacement = (
              "const templateImg=new Image();let templateReady=false;\n"
              "templateImg.onload=()=>{templateReady=true;renderStory()};\n"
              "templateImg.onerror=()=>{templateReady=false;document.getElementById('storyInfo').textContent='마스터 템플릿을 불러오지 못했어.';renderStory()};\n"
              f"const STORY_TEMPLATE_SRC='data:image/jpeg;base64,{b64}';\n"
              "templateImg.src=STORY_TEMPLATE_SRC;"
          )

          new_html, count = old.subn(replacement, html, count=1)
          if count != 1:
              raise SystemExit(f'Expected one template loader block, replaced {count}')

          new_html = new_html.replace('SNS Manager V7.5', 'SNS Manager V7.5.2')
          new_html = new_html.replace('<span class="pill">V7.5</span>', '<span class="pill">V7.5.2</span>')
          index.write_text(new_html, encoding='utf-8')
          PY

      - name: Remove external template dependency and workflow
        shell: bash
        run: |
          rm -f story-master-v2.b64
          rm -f .github/workflows/inline-story-template.yml

      - name: Commit inline version
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html story-master-v2.b64 .github/workflows/inline-story-template.yml
          git commit -m "Inline Story master template into index.html"
          git push
