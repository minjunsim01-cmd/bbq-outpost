name: Fix Template Loader V7.5.3b

on:
  push:
    paths:
      - '.github/workflows/fix-template-loader-v753b.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch loader
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
          rm -f .github/workflows/fix-template-loader-v753b.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/fix-template-loader-v753b.yml
          git commit -m 'Fix Story template loader V7.5.3'
          git push
